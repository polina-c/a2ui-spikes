name: wix_ai_chat
description: A Wix page's AI chat, in Jaspr, with the model running in the browser.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  genui:
    path: ../../jaspr/genui
  jaspr: ^0.23.4
  logging: ^1.3.0
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.2
  lints: ^5.0.0
  test: ^1.26.2

jaspr:
  mode: client
  # The only styles mode client rendering supports: CSS is emitted as a file
  # rather than injected by a server render.
  styles: standalone
