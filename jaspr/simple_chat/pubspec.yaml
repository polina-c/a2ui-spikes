name: simple_chat
description: A chat that answers with generated UI, running a model in the browser.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  a2ui_core: ^0.1.1
  genui:
    path: ../genui
  jaspr: ^0.23.4
  logging: ^1.3.0
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.2
  lints: ^5.0.0

jaspr:
  mode: client
  # The only styles mode client rendering supports: CSS is emitted as a
  # file rather than injected by a server render.
  styles: standalone
